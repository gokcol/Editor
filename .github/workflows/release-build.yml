name: Release builds

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to compile
        type: choice
        default: both
        options: [both, macos, windows]
      verify_run:
        description: Optional existing build run ID; verify its Windows installers without rebuilding
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    if: inputs.verify_run == ''
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'macos' && '["macos-latest"]' || inputs.platform == 'windows' && '["windows-latest"]' || '["macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            7txt/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../target
          cache-on-failure: true
      - name: Install frontend dependencies
        shell: bash
        run: |
          npm ci
          npm --prefix 7txt ci
      - name: Frontend tests
        run: npm test
      - name: Native tests
        shell: bash
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path 7txt/src-tauri/Cargo.toml
      - name: Build macOS universal packages
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          npm run tauri -- build --ci --target universal-apple-darwin --bundles app,dmg --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}' -- --locked
          npm --prefix 7txt run build -- --ci --target universal-apple-darwin --bundles app,dmg --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}' -- --locked
          mkdir -p release
          cp "$CARGO_TARGET_DIR"/universal-apple-darwin/release/bundle/dmg/*.dmg release/
          codesign --verify --deep --strict "$CARGO_TARGET_DIR/universal-apple-darwin/release/bundle/macos/Yedit.app"
          codesign --verify --deep --strict "$CARGO_TARGET_DIR/universal-apple-darwin/release/bundle/macos/7TXT.app"
          lipo "$CARGO_TARGET_DIR/universal-apple-darwin/release/bundle/macos/Yedit.app/Contents/MacOS/Yedit" -verify_arch arm64 x86_64
          lipo "$CARGO_TARGET_DIR/universal-apple-darwin/release/bundle/macos/7TXT.app/Contents/MacOS/7TXT" -verify_arch arm64 x86_64
      - name: Build Windows installers
        if: runner.os == 'Windows'
        run: |
          npm run tauri -- build --ci --bundles nsis -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix 7txt run build -- --ci --bundles nsis -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force release
          Copy-Item "$env:CARGO_TARGET_DIR/release/bundle/nsis/*.exe" release/
      - name: Test native Windows editing and recovery
        if: runner.os == 'Windows'
        run: |
          ./scripts/install-windows-packages.ps1
          npm install --prefix "$env:RUNNER_TEMP/editor-smoke" --no-save playwright@1.65.1
          node scripts/windows-smoke.mjs "$env:RUNNER_TEMP/editor-smoke/node_modules/playwright/index.mjs" "$env:CARGO_TARGET_DIR/release" release
      - name: Upload packages and validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editors-${{ runner.os }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  verify-windows:
    if: inputs.verify_run != ''
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: editors-Windows
          path: input
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verify_run }}
      - name: Install and verify existing Windows packages
        run: |
          ./scripts/install-windows-packages.ps1 -Packages input -Reports release
          npm install --prefix "$env:RUNNER_TEMP/editor-smoke" --no-save playwright@1.65.1
          node scripts/windows-smoke.mjs "$env:RUNNER_TEMP/editor-smoke/node_modules/playwright/index.mjs" unused release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-installer-verification
          path: release/
          if-no-files-found: error
