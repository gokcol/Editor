[package]
name = "seventxt"
version = "0.1.7"
description = "A lightweight native text and Markdown editor for macOS."
authors = ["Orhan Gökçöl"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
encoding_rs = "0.8.35"
rfd = "0.16"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
