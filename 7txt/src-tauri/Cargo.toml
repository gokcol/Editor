[package]
name = "seventxt"
version = "0.1.10"
description = "A lightweight native text and Markdown editor for macOS."
authors = ["Orhan Gökçöl"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
cc = "1"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
encoding_rs = "0.8.35"
rfd = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
