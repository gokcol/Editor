[package]
name = "seventxt"
version = "1.0.2"
description = "A lightweight native text and Markdown editor for macOS."
authors = ["Orhan Gökçöl"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
cc = "1"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
dirs = "6"
encoding_rs = "0.8.35"
libc = "0.2"
rfd = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-opener = "=2.5.4"
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["ApplicationModel", "Services_Store", "Win32_Foundation", "Win32_Storage_Packaging_Appx", "Win32_System_WinRT", "Win32_UI_Shell"] }
trash = "5.2"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
